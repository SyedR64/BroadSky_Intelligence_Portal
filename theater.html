<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D map · Broad Sky OS</title>
<meta name="description" content="The 3D map now opens inside the portal.">
<meta name="theme-color" content="#fbfaf7">
<!-- A forwarding page (scripts/ci_check.py): the 3D map lives in the portal. It is not rendered, indexed or listed. -->
<meta name="bsp-forward" content="app.html#/theater/play">
<script>/* hand the visitor on at once. What the portal screen reads (scene, autoplay, fallback) goes inside the hash; anything else stays in the page's own query string */(function(){var to='app.html#/theater/play';try{var view=new URLSearchParams(),rest=new URLSearchParams();new URLSearchParams(location.search).forEach(function(v,k){(k==='scene'||k==='autoplay'||k==='fallback'?view:rest).append(k,v)});view=view.toString();rest=rest.toString();to='app.html'+(rest?'?'+rest:'')+'#/theater/play'+(view?'?'+view:'')}catch(e){}location.replace(to);document.addEventListener('DOMContentLoaded',function(){var a=document.getElementById('go');if(a)a.setAttribute('href',to)})})();</script>
<noscript><meta http-equiv="refresh" content="0; url=app.html#/theater/play"></noscript>
<script>/* one theme for the whole site (UNIFIED.md §8): apply the saved choice (localStorage 'bsp-theme', light by default) before the stylesheets load */(function(){try{var t=localStorage.getItem('bsp-theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-sys-theme',t);if(t==='dark'){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#0a0e14')}}}catch(e){}})();</script>
<link rel="icon" href="BSP_Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/system.css?v=20261124123408">
<style>
  /* page layout only: one notice card in the middle of the screen */
  .fw { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: var(--sys-sp-6) var(--sys-gut); }
  .fw-card { width: min(460px, 100%); }
  .fw-card .sys-actions { margin-top: var(--sys-sp-2); }
</style>
</head>
<body>
<main id="main" class="fw">
  <div class="sys-card fw-card">
    <p class="sys-card-label">Broad Sky OS · 3D map</p>
    <h1 class="sys-card-title">This page has moved into the portal.</h1>
    <div class="sys-actions"><a class="sys-btn sys-btn--primary" id="go" href="app.html#/theater/play">Open the 3D map</a></div>
  </div>
</main>
</body>
</html>
