<meta name="bsp-forward" content="app.html#/home/overview">
<script>/* hand the visitor on at once, keeping the query string (?role=, ?backend=). Old anchors of the front page land where their content now lives (OS build spec 4.5) */(function(){var MAP={'#briefing':'app.html#/briefing/play','#platforms':'app.html#/home/overview','#deals':'app.html#/ma/pipeline','#os':'redesigns/#os','#growth-plans':'redesigns/#growth-plans'};var to='app.html#/home/overview';try{var t=MAP[location.hash]||to,i=t.indexOf('#'),path=t.slice(0,i),hash=t.slice(i);to=path+(location.search||'')+hash}catch(e){}location.replace(to);document.addEventListener('DOMContentLoaded',function(){var a=document.getElementById('go');if(a)a.setAttribute('href',to)})})();</script>
<noscript><meta http-equiv="refresh" content="0; url=app.html#/home/overview"></noscript>
<script>/* one theme for the whole site (UNIFIED.md §8): apply the saved choice (localStorage 'bsp-theme', light by default) before the stylesheets load */(function(){try{var t=localStorage.getItem('bsp-theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-sys-theme',t);if(t==='dark'){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#0a0e14')}}}catch(e){}})();</script>
